services:
  - type: web
    name: barrioleagues-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEST_MODE
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SESSION_TTL
        value: 8h
      - key: ADMIN_COOKIE_SAME_SITE
        value: none
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_MATCH_TEMPLATE_NAME
        value: aviso_partido_jornada
      - key: WHATSAPP_MATCH_TEMPLATE_LANGUAGE
        value: es_MX
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v23.0
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_SCHEDULED_TEST_PHONE
        sync: false
  - type: cron
    name: barrioleagues-scheduler
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run cron:run
    schedule: "* * * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEST_MODE
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v23.0
      - key: WHATSAPP_MATCH_TEMPLATE_NAME
        value: aviso_partido_jornada
      - key: WHATSAPP_MATCH_TEMPLATE_LANGUAGE
        value: es_MX
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_SCHEDULED_TEST_PHONE
        sync: false
